<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search · Market Intelligence Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">📊 Market Intel Analyzer</a>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/influencers">Influencers</a>
        <a class="nav-link" href="/analytics">Analytics</a>
        <a class="nav-link active" href="/search">Search</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <form id="search-form" class="mb-4">
      <div class="input-group input-group-lg">
        <input type="text" class="form-control" id="search-input"
               placeholder="Search by stock, IPO, topic, or influencer — e.g. TCS, NSDL IPO, US-China Tensions">
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
    </form>

    <div id="search-results">
      <div class="empty-state">Enter a search term to find related reels and analyses.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/search.js"></script>
</body>
</html>
