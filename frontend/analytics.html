<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics · Market Intelligence Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-graph-up-arrow me-2"></i>Market Intel Analyzer</a>
      <div class="navbar-nav flex-row gap-2">
        <a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a class="nav-link" href="/influencers"><i class="bi bi-people me-1"></i>Influencers</a>
        <a class="nav-link active" href="/analytics"><i class="bi bi-bar-chart me-1"></i>Analytics</a>
        <a class="nav-link" href="/search"><i class="bi bi-search me-1"></i>Search</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <!-- Summary stat tiles -->
    <div class="row g-3 mb-4" id="analytics-stats">
      <div class="col-6 col-md-3"><div class="stat-card h-100 skeleton" style="min-height:90px"></div></div>
      <div class="col-6 col-md-3"><div class="stat-card h-100 skeleton" style="min-height:90px"></div></div>
      <div class="col-6 col-md-3"><div class="stat-card h-100 skeleton" style="min-height:90px"></div></div>
      <div class="col-6 col-md-3"><div class="stat-card h-100 skeleton" style="min-height:90px"></div></div>
    </div>

    <!-- Charts row 1 -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div class="panel p-3 h-100">
          <div class="section-title mt-0"><i class="bi bi-graph-up text-bull me-2"></i>Most Mentioned Stocks</div>
          <div id="stocksWrap"><canvas id="stocksChart" height="220"></canvas></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel p-3 h-100">
          <div class="section-title mt-0"><i class="bi bi-pie-chart me-2" style="color:var(--accent)"></i>Sentiment Distribution</div>
          <div id="sentimentWrap"><canvas id="sentimentChart" height="220"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Charts row 2 -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div class="panel p-3 h-100">
          <div class="section-title mt-0"><i class="bi bi-stars me-2" style="color:var(--accent)"></i>Most Discussed IPOs</div>
          <div id="iposWrap"><canvas id="iposChart" height="220"></canvas></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel p-3 h-100">
          <div class="section-title mt-0"><i class="bi bi-layers me-2" style="color:var(--neutral)"></i>Sectors &amp; Topics</div>
          <div id="sectorsWrap"><canvas id="sectorsChart" height="220"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Charts row 3 -->
    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div class="panel p-3 h-100">
          <div class="section-title mt-0"><i class="bi bi-bank me-2" style="color:var(--cyan)"></i>Economic Events</div>
          <div id="econWrap"><canvas id="econChart" height="220"></canvas></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel p-3 h-100">
          <div class="section-title mt-0"><i class="bi bi-globe2 me-2" style="color:var(--purple)"></i>Geopolitical Events</div>
          <div id="geoWrap"><canvas id="geoChart" height="220"></canvas></div>
        </div>
      </div>
    </div>

    <!-- Influencer leaderboard -->
    <div class="row g-4">
      <div class="col-12">
        <div class="panel p-3">
          <div class="section-title mt-0"><i class="bi bi-trophy me-2" style="color:var(--neutral)"></i>Influencer Leaderboard — Most Analyzed Reels</div>
          <div id="leaderboard-list">
            <div class="text-muted text-center py-4">Loading…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/js/config.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/analytics.js"></script>
</body>
</html>
